<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>ODİS — Akademik Yıl Yaşam Döngüsü Test Senaryosu</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 24px;
      margin: 0;
    }
    .test-container {
      max-width: 960px;
      margin: 0 auto;
    }
    .test-header {
      background: #1e293b;
      padding: 20px 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 24px;
    }
    .test-header h1 {
      font-size: 20px;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .test-step-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }
    .test-step-card.pass {
      border-left: 6px solid #22c55e;
    }
    .test-step-card.fail {
      border-left: 6px solid #ef4444;
    }
    .step-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .badge-pass { background: #14532d; color: #4ade80; }
    .badge-fail { background: #7f1d1d; color: #f87171; }
    .badge-running { background: #1e3a8a; color: #60a5fa; }
    .step-title {
      font-size: 15px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 6px;
    }
    .step-detail {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .step-log {
      background: #0f172a;
      padding: 10px 14px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      color: #38bdf8;
      margin-top: 10px;
      white-space: pre-wrap;
    }
    #preview-area {
      background: #ffffff;
      color: #0f172a;
      border-radius: 12px;
      padding: 20px;
      margin-top: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div class="test-container">
    <div class="test-header">
      <h1>🧪 ODİS v3 — Otomatik Test Senaryosu Doğrulama Konsolu</h1>
      <p style="color:#cbd5e1;font-size:14px;margin:0">
        <strong>Senaryo:</strong> 2025–2026 yılı öğrenci ve 3 disiplin kaydı oluşturma, 2026–2027 yılına geçiş, yeni yıl boş ekran kontrolü ve geçmiş yıl kayıtlarına erişim.
      </p>
    </div>

    <div id="test-steps-list">
      <div class="test-step-card" id="step-init">
        <span class="step-badge badge-running">Hazırlanıyor</span>
        <div class="step-title">Test Ortamı Başlatılıyor...</div>
      </div>
    </div>

    <h2 style="font-size:16px;font-weight:700;margin-top:28px;color:#cbd5e1">Canlı UI Simülasyon Alanı</h2>
    <div id="preview-area">
      <!-- Live DOM rendered here for visual inspection -->
      <div id="app"></div>
    </div>
  </div>

  <script src="./js/database.js"></script>
  <script src="./js/seed-data.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/schools.js"></script>
  <script src="./js/students.js"></script>
  <script src="./js/records.js"></script>
  <script src="./js/admin-actions.js"></script>
  <script src="./js/qr-scanner.js"></script>
  <script src="./js/dashboard.js"></script>
  <script src="./js/router.js"></script>
  <script src="./js/counselor.view.js"></script>
  <script src="./js/admin.view.js"></script>
  <script src="./js/teacher.view.js"></script>
  <script src="./js/student.view.js"></script>
  <script src="./js/app.js"></script>

  <script>
    window.__testResults = {
      steps: [],
      passed: false,
      completed: false,
    };

    function renderStepUI(stepNum, title, isPass, detail, log) {
      const container = document.getElementById('test-steps-list');
      const card = document.createElement('div');
      card.className = `test-step-card ${isPass ? 'pass' : 'fail'}`;
      card.innerHTML = `
        <span class="step-badge ${isPass ? 'badge-pass' : 'badge-fail'}">
          ${isPass ? '✓ BAŞARILI (PASS)' : '✗ BAŞARISIZ (FAIL)'}
        </span>
        <div class="step-title">Adım ${stepNum}: ${title}</div>
        <div class="step-detail">${detail}</div>
        ${log ? `<div class="step-log">${log}</div>` : ''}
      `;
      container.appendChild(card);
    }

    async function runTestScenario() {
      console.log('=== TEST SENARYOSU BAŞLATILIYOR ===');
      const stepsLog = [];

      try {
        // 0. Init Database & Auth
        await Database.open();
        await SeedData.seed();
        Auth.login('mudur', 'odis123'); // Admin privileges

        const schoolId = 'school_kasif';
        await Schools.setActiveSchool(schoolId);
        document.getElementById('step-init').remove();

        // -------------------------------------------------------------
        // ADIM 1: 2025-2026 yılına ait bir öğrenci kaydı oluşturulsun.
        // -------------------------------------------------------------
        const year2526 = 'ay_kasif_2526';
        const year2627 = 'ay_kasif_2627';

        // Set active academic year to 2025-2026
        await AcademicYears.setActiveYear(year2526, schoolId);

        const testStudentData = {
          studentNo: '992025',
          firstName: 'Deniz',
          lastName: 'Yılmaz',
          class: '10-A',
          academicYearId: year2526,
          schoolId,
        };

        const createdStudent = await Students.create(testStudentData);
        const step1Pass = Boolean(createdStudent && createdStudent.id && createdStudent.studentNo === '992025');
        
        renderStepUI(
          1,
          '2025–2026 Yılına Ait Öğrenci Kaydı Oluşturulması',
          step1Pass,
          `Öğrenci başarıyla sisteme kaydedildi: <strong>${createdStudent.firstName} ${createdStudent.lastName}</strong> (No: ${createdStudent.studentNo}, Sınıf: ${createdStudent.class})`,
          JSON.stringify({ id: createdStudent.id, studentNo: createdStudent.studentNo, academicYearId: createdStudent.academicYearId }, null, 2)
        );
        stepsLog.push({ step: 1, pass: step1Pass });

        // -------------------------------------------------------------
        // ADIM 2: Öğrenci hakkında üç disiplin kaydı girilsin.
        // -------------------------------------------------------------
        const record1 = await Records.create({
          studentId: createdStudent.id,
          academicYearId: year2526,
          category: 'kilik-kiyafet',
          description: 'Okul üniforması yerine sivil kıyafetle okula gelindi.',
          dateTime: '2025-10-15T08:15:00.000Z',
          createdBy: 'Ayşe Kaya (Öğretmen)',
        });

        const record2 = await Records.create({
          studentId: createdStudent.id,
          academicYearId: year2526,
          category: 'arma',
          description: 'Okul arması ve amblemi formaya dikilmemiş.',
          dateTime: '2025-11-20T08:20:00.000Z',
          createdBy: 'Mehmet Yılmaz (Öğretmen)',
        });

        const record3 = await Records.create({
          studentId: createdStudent.id,
          academicYearId: year2526,
          category: 'sac',
          description: 'Kılık kıyafet yönetmeliğine aykırı uygunsuz saç modeli.',
          dateTime: '2026-03-10T08:30:00.000Z',
          createdBy: 'Ayşe Kaya (Öğretmen)',
        });

        // Verify 3 records exist for student in 2025-2026
        const studentStats2526 = await Students.getWithStats(createdStudent.id, year2526);
        const step2Pass = (studentStats2526.records.length === 3);

        renderStepUI(
          2,
          'Öğrenci Hakkında Üç Disiplin Kaydının Girilmesi',
          step2Pass,
          `2025–2026 eğitim yılında 3 disiplin / kural ihlal kaydı girildi ve doğrulandı.`,
          `1. [${record1.category}] ${record1.description} (${record1.createdBy})\n` +
          `2. [${record2.category}] ${record2.description} (${record2.createdBy})\n` +
          `3. [${record3.category}] ${record3.description} (${record3.createdBy})\n` +
          `-> Toplam Kayıt: ${studentStats2526.records.length}`
        );
        stepsLog.push({ step: 2, pass: step2Pass });

        // -------------------------------------------------------------
        // ADIM 3: Aktif eğitim yılı 2026-2027 olarak değiştirilsin.
        // -------------------------------------------------------------
        await AcademicYears.setActiveYear(year2627, schoolId);
        const currentActiveYear = await AcademicYears.getActiveYear(schoolId);
        const step3Pass = (currentActiveYear.id === year2627 && currentActiveYear.code === '2026-2027');

        renderStepUI(
          3,
          'Aktif Eğitim Yılının 2026–2027 Olarak Değiştirilmesi',
          step3Pass,
          `Okulun aktif eğitim-öğretim dönemi başarıyla <strong>2026–2027 (${year2627})</strong> olarak güncellendi.`,
          `Aktif Dönem ID: ${currentActiveYear.id}\nAktif Dönem Kodu: ${currentActiveYear.code}\nisCurrent: ${currentActiveYear.isCurrent}`
        );
        stepsLog.push({ step: 3, pass: step3Pass });

        // -------------------------------------------------------------
        // ADIM 4: Öğrencinin yeni yıl ekranı kontrol edilsin.
        // Beklenen sonuç: Yeni yılın aktif kayıtları boş olmalı!
        // -------------------------------------------------------------
        const studentNewYear = await Students.getWithStats(createdStudent.id, year2627);
        const newYearRecordsCount = studentNewYear.records.length;
        const newYearTotalStat = studentNewYear.stats.totalRecords;
        const pastPreservedInNewYear = studentNewYear.pastRecords.length;

        // Render to DOM to verify live UI rendering for teacher card and student detail
        await renderStudentCard(createdStudent.id, year2627);

        const emptyMessageShown = document.body.innerText.includes('Döneminde Aktif Düzen Kaydı Yok') ||
                                 document.body.innerText.includes('yeni yıl disiplin kayıtları boştur') ||
                                 document.body.innerText.includes('düzen kaydı bulunmamaktadır');

        const step4Pass = (newYearRecordsCount === 0 && newYearTotalStat === 0 && pastPreservedInNewYear === 3);

        renderStepUI(
          4,
          'Öğrencinin Yeni Yıl Ekranının Kontrol Edilmesi',
          step4Pass,
          `<strong>Beklenen Sonuç:</strong> Yeni yılın aktif kayıtları BOŞ olmalı.<br>` +
          `<strong>Gerçekleşen:</strong> 2026–2027 aktif kayıt sayısı: <strong>${newYearRecordsCount}</strong>. UI boş ekran uyarısı ve temiz sayfa durumu onaylandı.`,
          `Aktif Dönem (2026-2027) Kayıt Sayısı: ${newYearRecordsCount} (BEKLENEN: 0)\n` +
          `Geçmişten Devreden Korunan Kayıt Sayısı: ${pastPreservedInNewYear} (BEKLENEN: 3)\n` +
          `Boş Ekran Arayüz Mesajı: ${emptyMessageShown ? 'EVET (Görüntülendi)' : 'HAYIR'}`
        );
        stepsLog.push({ step: 4, pass: step4Pass });

        // -------------------------------------------------------------
        // ADIM 5: Geçmiş yıl kayıtlarına tekrar erişilsin.
        // Beklenen sonuç: Geçmiş yılın üç kaydı ise korunmalı.
        // -------------------------------------------------------------
        const studentPastYear = await Students.getWithStats(createdStudent.id, year2526);
        const pastRecordsCount = studentPastYear.records.length;

        // Also test switching UI to past year in live DOM
        await renderStudentDetail(createdStudent.id, year2526);

        const hasRecord1 = studentPastYear.records.some(r => r.category === 'kilik-kiyafet' && r.description.includes('sivil kıyafet'));
        const hasRecord2 = studentPastYear.records.some(r => r.category === 'arma' && r.description.includes('Okul arması'));
        const hasRecord3 = studentPastYear.records.some(r => r.category === 'sac' && r.description.includes('saç modeli'));

        const step5Pass = (pastRecordsCount === 3 && hasRecord1 && hasRecord2 && hasRecord3);

        renderStepUI(
          5,
          'Geçmiş Yıl Kayıtlarına Tekrar Erişilmesi',
          step5Pass,
          `<strong>Beklenen Sonuç:</strong> Geçmiş yılın 3 disiplin kaydı eksiksiz korunmalı.<br>` +
          `<strong>Gerçekleşen:</strong> 2025–2026 arşivinde kayıtlı <strong>${pastRecordsCount}</strong> kayıt tam veri bütünlüğüyle korundu.`,
          `Kayıt 1 Doğrulandı: [Kılık-Kıyafet] -> ${hasRecord1}\n` +
          `Kayıt 2 Doğrulandı: [Okul Arması] -> ${hasRecord2}\n` +
          `Kayıt 3 Doğrulandı: [Saç Kuralı] -> ${hasRecord3}\n` +
          `Geçmiş Dönem Kayıt Sayısı: ${pastRecordsCount} (BEKLENEN: 3)`
        );
        stepsLog.push({ step: 5, pass: step5Pass });

        // SUMMARY
        const allPass = stepsLog.every(s => s.pass);
        window.__testResults = {
          steps: stepsLog,
          passed: allPass,
          completed: true,
        };

        const summaryCard = document.createElement('div');
        summaryCard.style.padding = '20px';
        summaryCard.style.borderRadius = '12px';
        summaryCard.style.marginTop = '24px';
        summaryCard.style.background = allPass ? '#14532d' : '#7f1d1d';
        summaryCard.style.color = 'white';
        summaryCard.style.fontWeight = '700';
        summaryCard.style.fontSize = '16px';
        summaryCard.innerHTML = allPass
          ? '🎉 TÜM TEST ADIMLARI BAŞARIYLA TAMAMLANDI: Yeni yılın aktif kayıtları boş, geçmiş yılın 3 kaydı korundu!'
          : '⚠️ TEST SENARYOSUNDA BAŞARISIZ ADIMLAR MEVCUT!';
        document.getElementById('test-steps-list').appendChild(summaryCard);

        console.log('=== TEST SONUCU:', allPass ? 'BAŞARILI (PASS)' : 'BAŞARISIZ (FAIL)', '===');

        // Post results to runner
        try {
          await fetch('/api/test-results', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(window.__testResults),
          });
        } catch (e) {
          // Ignore
        }
      } catch (error) {
        console.error('Test senaryosu çalışma hatası:', error);
        window.__testResults = {
          error: error.message,
          passed: false,
          completed: true,
        };

        try {
          await fetch('/api/test-results', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(window.__testResults),
          });
        } catch (e) {
          // Ignore
        }
      }
    }

    // Auto run on load
    window.addEventListener('DOMContentLoaded', runTestScenario);
  </script>
</body>
</html>
