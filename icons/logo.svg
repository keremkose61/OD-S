<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <style>
      .amber-border { fill: none; stroke: #f59e0b; stroke-width: 14; }
      .amber-fill { fill: #f59e0b; }
      .charcoal-fill { fill: #3f3f46; }
      .logo-text-kasif { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 44px; font-weight: 700; fill: #3f3f46; letter-spacing: 24px; text-anchor: middle; }
      .logo-text-kalkavan { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 46px; font-weight: 800; fill: #3f3f46; letter-spacing: 12px; text-anchor: middle; }
      .logo-text-lise { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 34px; font-weight: 600; fill: #3f3f46; letter-spacing: 5px; text-anchor: middle; }
    </style>
  </defs>

  <!-- Clean White Background -->
  <rect width="500" height="500" fill="#ffffff" />

  <!-- Outer Yellow/Amber Frame -->
  <rect x="25" y="25" width="450" height="450" rx="4" class="amber-border" />

  <!-- Background Amber Wing/Triangle -->
  <polygon points="120,86 380,86 250,215" class="amber-fill" />

  <!-- Stylized Figure Emblem -->
  <!-- Head (Circle) -->
  <circle cx="250" cy="88" r="38" class="charcoal-fill" />

  <!-- White halo around head for crisp negative space -->
  <circle cx="250" cy="88" r="44" fill="none" stroke="#ffffff" stroke-width="12" />

  <!-- Center White Vertical Divider -->
  <rect x="238" y="126" width="24" height="134" fill="#ffffff" />

  <!-- Left 'K' Branch (Upper Arm) -->
  <path d="M 120,95 C 105,80 80,105 95,120 L 225,200 L 225,170 Z" class="charcoal-fill" />
  <line x1="225" y1="180" x2="110" y2="108" stroke="#3f3f46" stroke-width="38" stroke-linecap="round" />

  <!-- Left 'K' Branch (Lower Leg) -->
  <line x1="225" y1="180" x2="110" y2="242" stroke="#3f3f46" stroke-width="38" stroke-linecap="round" />

  <!-- Left Vertical Spine -->
  <line x1="216" y1="140" x2="216" y2="244" stroke="#3f3f46" stroke-width="32" stroke-linecap="round" />

  <!-- Right 'K' Branch (Upper Arm) -->
  <line x1="275" y1="180" x2="390" y2="108" stroke="#3f3f46" stroke-width="38" stroke-linecap="round" />

  <!-- Right 'K' Branch (Lower Leg) -->
  <line x1="275" y1="180" x2="390" y2="242" stroke="#3f3f46" stroke-width="38" stroke-linecap="round" />

  <!-- Right Vertical Spine -->
  <line x1="284" y1="140" x2="284" y2="244" stroke="#3f3f46" stroke-width="32" stroke-linecap="round" />

  <!-- Text: KAŞİF -->
  <text x="262" y="322" class="logo-text-kasif">KAŞİF</text>

  <!-- Divider Line -->
  <line x1="75" y1="338" x2="425" y2="338" stroke="#f59e0b" stroke-width="7" stroke-linecap="square" />

  <!-- Text: KALKAVAN -->
  <text x="256" y="386" class="logo-text-kalkavan">KALKAVAN</text>

  <!-- Text: Anadolu Lisesi -->
  <text x="254" y="426" class="logo-text-lise">Anadolu Lisesi</text>
</svg>
